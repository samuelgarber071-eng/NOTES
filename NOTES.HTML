<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Bloco de Notas Avançado</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #4a90e2;
      --danger-color: #e74c3c;
      --success-color: #2ecc71;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-main {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-main:hover {
      background-color: #357abd;
    }

    .notes-list {
      list-style: none;
    }

    .note-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border-left: 5px solid var(--primary-color);
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
    }

    .btn-add-sub {
      background-color: #eef5fc;
      color: var(--primary-color);
    }

    .btn-delete {
      background-color: #fde8e8;
      color: var(--danger-color);
    }

    /* Estilos das Subnotas */
    .subnotes-list {
      list-style: none;
      margin-top: 10px;
      padding-left: 20px;
      border-left: 2px solid var(--border-color);
    }

    .subnote-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 14px;
    }

    .completed {
      text-decoration: line-through;
      color: #888;
    }

    .sub-input-group {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .sub-input-group input {
      padding: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📝 Minhas Notas & Subnotas</h1>
    
    <div class="input-group">
      <input type="text" id="noteInput" placeholder="Digite o título da nota principal...">
      <button class="btn-main" onclick="addNote()">Criar Nota</button>
    </div>

    <ul class="notes-list" id="notesContainer"></ul>
  </div>

  <script>
    let notes = JSON.parse(localStorage.getItem('my_notes')) || [];

    function saveNotes() {
      localStorage.setItem('my_notes', JSON.stringify(notes));
      renderNotes();
    }

    function addNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();
      if (text === '') return;

      notes.push({
        id: Date.now(),
        title: text,
        subnotes: [],
        showSubInput: false
      });

      input.value = '';
      saveNotes();
    }

    function deleteNote(id) {
      notes = notes.filter(n => n.id !== id);
      saveNotes();
    }

    function toggleSubInput(id) {
      const note = notes.find(n => n.id === id);
      if (note) {
        note.showSubInput = !note.showSubInput;
        renderNotes();
      }
    }

    function addSubNote(noteId) {
      const input = document.getElementById(`sub-input-${noteId}`);
      const text = input.value.trim();
      if (text === '') return;

      const note = notes.find(n => n.id === noteId);
      if (note) {
        note.subnotes.push({
          id: Date.now(),
          text: text,
          done: false
        });
        note.showSubInput = false;
        saveNotes();
      }
    }

    function toggleSubNote(noteId, subId) {
      const note = notes.find(n => n.id === noteId);
      if (note) {
        const sub = note.subnotes.find(s => s.id === subId);
        if (sub) sub.done = !sub.done;
        saveNotes();
      }
    }

    function deleteSubNote(noteId, subId) {
      const note = notes.find(n => n.id === noteId);
      if (note) {
        note.subnotes = note.subnotes.filter(s => s.id !== subId);
        saveNotes();
      }
    }

    function renderNotes() {
      const container = document.getElementById('notesContainer');
      container.innerHTML = '';

      notes.forEach(note => {
        const card = document.createElement('li');
        card.className = 'note-card';

        let subnotesHTML = note.subnotes.map(sub => `
          <li class="subnote-item">
            <span class="${sub.done ? 'completed' : ''}" style="cursor:pointer;" onclick="toggleSubNote(${note.id}, ${sub.id})">
              ${sub.done ? '☑' : '☐'} ${sub.text}
            </span>
            <button class="btn-small btn-delete" onclick="deleteSubNote(${note.id}, ${sub.id})">✕</button>
          </li>
        `).join('');

        card.innerHTML = `
          <div class="note-header">
            <span>${note.title}</span>
            <div class="actions">
              <button class="btn-small btn-add-sub" onclick="toggleSubInput(${note.id})">+ Subnota</button>
              <button class="btn-small btn-delete" onclick="deleteNote(${note.id})">Excluir</button>
            </div>
          </div>
          
          ${note.showSubInput ? `
            <div class="sub-input-group">
              <input type="text" id="sub-input-${note.id}" placeholder="Digite a subnota...">
              <button class="btn-main btn-small" onclick="addSubNote(${note.id})">Salvar</button>
            </div>
          ` : ''}

          <ul class="subnotes-list">
            ${subnotesHTML}
          </ul>
        `;

        container.appendChild(card);
      });
    }

    // Carregar notas iniciais
    renderNotes();
  </script>
</body>
</html>
