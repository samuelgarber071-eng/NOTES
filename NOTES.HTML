<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas Avançado</title>
    <style>
        :root {
            --bg-sidebar: #202123;
            --bg-main: #343541;
            --bg-input: #40414F;
            --text-main: #ECECF1;
            --text-muted: #9A9B9F;
            --border-color: #4D4D4F;
            --accent-green: #10a37f;
            --accent-blue: #3498db;
            --accent-red: #ef4444;
            --accent-yellow: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 12px;
            border-right: 1px solid var(--border-color);
            transition: margin-left 0.3s ease;
            z-index: 10;
        }

        body.sidebar-fechada .sidebar {
            margin-left: -320px;
        }

        .botoes-topo {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn-nova-pasta {
            flex: 1;
            background-color: var(--accent-green);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-nova-pasta:hover {
            background-color: #0e8e6d;
        }

        .btn-nova-pasta:active {
            transform: scale(0.98);
        }

        /* --- BACKUP --- */
        .backup-container {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--border-color);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            gap: 6px;
        }

        .btn-backup {
            flex: 1;
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            transition: background 0.2s;
        }

        .btn-backup:hover { background-color: rgba(255,255,255,0.1); }
        .file-input-label { display: block; text-align: center; }
        input[type="file"] { display: none; }

        .section-title {
            font-size: 11px;
            font-weight: bold;
            color: var(--text-muted);
            margin: 12px 0 6px 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
        }

        .area-rolavel {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* --- ESTRUTURA DE PASTAS E SUB-NOTAS --- */
        .container-pasta {
            margin-bottom: 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 6px;
            transition: border-color 0.2s;
        }

        .container-pasta.fixada {
            border-color: rgba(241, 196, 15, 0.4);
            background: rgba(241, 196, 15, 0.03);
        }

        .item-pasta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 14px;
            border-radius: 4px;
            padding: 4px;
        }

        .info-pasta {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 55%;
        }

        .contador-sub {
            font-size: 10px;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 10px;
        }

        .acoes-pasta {
            display: flex;
            gap: 2px;
        }

        .lista-subnotas {
            margin-left: 14px;
            border-left: 2px solid var(--border-color);
            padding-left: 6px;
            margin-top: 6px;
        }

        .item-subnota {
            padding: 6px 8px;
            margin: 3px 0;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            transition: background 0.15s;
        }

        .item-subnota:hover { background-color: rgba(255,255,255,0.08); }
        .item-subnota.ativa { background-color: rgba(52, 152, 219, 0.3); font-weight: bold; }
        .item-subnota span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 80%; }

        .btn-action {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 3px 5px;
            border-radius: 3px;
            transition: color 0.15s, background 0.15s;
        }

        .btn-action:hover { color: var(--text-main); background-color: rgba(255,255,255,0.1); }
        .btn-delete:hover { color: var(--accent-red); }
        .btn-add-sub:hover { color: var(--accent-green); }
        .btn-pin.fixado { color: var(--accent-yellow); }

        /* --- BOTÃO FLUTUANTE SIDEBAR --- */
        .btn-toggle-sidebar {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        body:not(.sidebar-fechada) .btn-toggle-sidebar { left: 335px; }

        /* --- ÁREA PRINCIPAL --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            padding-top: 70px;
            background-color: var(--bg-main);
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        .fonte-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            align-self: flex-end;
            margin-bottom: 15px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .fonte-control input[type="range"] {
            accent-color: var(--accent-blue);
            cursor: pointer;
            width: 90px;
        }

        .input-titulo {
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            color: var(--text-main);
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
            outline: none;
            width: 100%;
            padding-bottom: 5px;
        }

        .input-titulo:focus {
            border-bottom-color: var(--border-color);
        }

        .textarea-conteudo {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Georgia', serif;
            font-size: 18px;
            line-height: 1.6;
            outline: none;
            resize: none;
            flex: 1;
            width: 100%;
        }

        .aviso-vazio {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 16px;
            text-align: center;
            line-height: 1.6;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    </style>
</head>
<body>

    <button class="btn-toggle-sidebar" onclick="toggleSidebar()">☰ Menu</button>

    <div class="sidebar" id="sidebar">
        <div class="botoes-topo">
            <button class="btn-nova-pasta" onclick="criarNovaPasta()">📁 Nova Coleção</button>
        </div>

        <div class="backup-container">
            <button class="btn-backup" onclick="exportarBackup()">💾 Exportar</button>
            <label class="btn-backup file-input-label">
                📂 Importar
                <input type="file" id="input-backup" accept=".json" onchange="importarBackup(event)">
            </label>
        </div>

        <div class="area-rolavel">
            <div class="section-title">
                <span>📌 Fixados</span>
                <span id="contador-fixados">0/3</span>
            </div>
            <div id="lista-fixados"></div>

            <div class="section-title">
                <span>📁 Todas as Coleções</span>
            </div>
            <div id="lista-comuns"></div>

            <div class="section-title">
                <span>🗑️ Lixeira</span>
            </div>
            <div id="lista-lixeira" style="max-height: 120px; overflow-y: auto;"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="editor-container" id="editor" style="display: none;">
            <div class="fonte-control">
                <span>A-</span>
                <input type="range" id="alterar-fonte" min="14" max="32" value="18" oninput="mudarTamanhoFonte(this.value)">
                <span>A+</span>
                <span id="valor-fonte">18px</span>
            </div>

            <input type="text" id="nota-titulo" class="input-titulo" placeholder="Título da sub-nota..." oninput="salvarSubNotaAtual()">
            <textarea id="nota-conteudo" class="textarea-conteudo" placeholder="Escreva aqui as suas anotações..." oninput="salvarSubNotaAtual()"></textarea>
        </div>

        <div class="aviso-vazio" id="aviso-vazio">
            Crie uma <b>Coleção</b> na barra lateral,<br>
            adicione sub-notas clicando no botão <b>➕</b> e selecione para editar.
        </div>
    </div>

    <script>
        let pastas = [];
        let idPastaAtiva = null;
        let idSubNotaAtiva = null;

        // Inicialização do Sistema
        carregarDadosIniciais();

        function carregarDadosIniciais() {
            const dadosSalvos = localStorage.getItem('livro_pastas_sistema');
            if (dadosSalvos) {
                pastas = JSON.parse(dadosSalvos);
            } else {
                // Tenta migrar a estrutura legada anterior se existir
                const notasAntigas = JSON.parse(localStorage.getItem('livro_notas'));
                if (notasAntigas && notasAntigas.length > 0) {
                    pastas = [{
                        id: Date.now().toString(),
                        titulo: "Minhas Notas Antigas",
                        fixada: false,
                        subnotas: notasAntigas.map(n => ({
                            id: n.id || Date.now().toString(),
                            titulo: n.titulo || "Sem título",
                            conteudo: n.conteudo || "",
                            naLixeira: n.naLixeira || false
                        }))
                    }];
                    salvarNoLocalStorage();
                } else {
                    pastas = [];
                }
            }

            const fonteSalva = localStorage.getItem('preferencia_fonte') || '18';
            mudarTamanhoFonte(fonteSalva);
            renderizarInterface();
        }

        function criarNovaPasta() {
            const nomePasta = prompt("Digite o nome da coleção/pasta:", "Nova Coleção");
            if (!nomePasta || !nomePasta.trim()) return;

            const novaPasta = {
                id: Date.now().toString(),
                titulo: nomePasta.trim(),
                fixada: false,
                subnotas: []
            };

            pastas.unshift(novaPasta);
            salvarNoLocalStorage();
            renderizarInterface();
        }

        function renomearPasta(event, idPasta) {
            event.stopPropagation();
            const pasta = pastas.find(p => p.id === idPasta);
            if (!pasta) return;

            const novoNome = prompt("Novo nome da coleção:", pasta.titulo);
            if (novoNome && novoNome.trim()) {
                pasta.titulo = novoNome.trim();
                salvarNoLocalStorage();
                renderizarInterface();
            }
        }

        function criarSubNota(event, idPasta) {
            event.stopPropagation();
            const pasta = pastas.find(p => p.id === idPasta);
            if (!pasta) return;

            const novaSub = {
                id: Date.now().toString(),
                titulo: 'Nova Sub-nota',
                conteudo: '',
                naLixeira: false
            };

            pasta.subnotas.unshift(novaSub);
            salvarNoLocalStorage();
            carregarSubNota(idPasta, novaSub.id);
        }

        function toggleFixarPasta(event, idPasta) {
            event.stopPropagation();
            const pasta = pastas.find(p => p.id === idPasta);
            if (!pasta) return;

            if (!pasta.fixada) {
                const totalFixadas =
