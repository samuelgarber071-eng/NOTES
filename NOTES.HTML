<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Notes</title>
  <style>
    :root {
      --bg-primary: #121214;
      --bg-secondary: #202024;
      --bg-card: #29292e;
      --accent: #8257e5;
      --accent-hover: #996dff;
      --text-main: #e1e1e6;
      --text-muted: #a8a8b3;
      --border: #323238;
      --danger: #f75a68;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      width: 260px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      background-color: var(--bg-card);
      color: var(--text-main);
    }

    /* Main Content */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 30px;
      overflow-y: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    /* Form para Nova Nota */
    .note-form {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .note-form input, .note-form textarea {
      background: transparent;
      border: none;
      color: var(--text-main);
      outline: none;
      font-size: 0.95rem;
    }

    .note-form input {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .note-form textarea {
      resize: none;
      height: 70px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
    }

    button.btn-add {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button.btn-add:hover {
      background-color: var(--accent-hover);
    }

    /* Grid de Notas */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .note-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .note-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .note-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .note-body {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-delete:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <aside>
    <div class="logo">⚡ Aura Notes</div>
    <ul class="nav-list">
      <li class="nav-item active">📝 Todas as Notas</li>
      <li class="nav-item">⭐ Favoritas</li>
      <li class="nav-item">🏷️ Tags</li>
      <li class="nav-item">🗑️ Lixeira</li>
    </ul>
  </aside>

  <main>
    <header>
      <h2>Minhas Anotações</h2>
    </header>

    <div class="note-form">
      <input type="text" id="titleInput" placeholder="Título da nota...">
      <textarea id="bodyInput" placeholder="Escreva algo incrível..."></textarea>
      <div class="form-actions">
        <button class="btn-add" onclick="addNote()">Salvar Nota</button>
      </div>
    </div>

    <div class="notes-grid" id="notesGrid">
      
      <div class="note-card">
        <div>
          <div class="note-title">Ideias de Projetos</div>
          <div class="note-body">Criar uma CLI em Rust para organizar arquivos baixados automaticamente por extensão.</div>
        </div>
        <div class="note-footer">
          <span>Hoje</span>
          <button class="btn-delete" onclick="this.closest('.note-card').remove()">Excluir</button>
        </div>
      </div>

      <div class="note-card">
        <div>
          <div class="note-title">Livros para ler</div>
          <div class="note-body">- O Entusiasta Pragmatico&#10;- O Design do Dia a Dia&#10;- Clean Code</div>
        </div>
        <div class="note-footer">
          <span>Ontem</span>
          <button class="btn-delete" onclick="this.closest('.note-card').remove()">Excluir</button>
        </div>
      </div>

    </div>
  </main>

  <script>
    function addNote() {
      const titleInput = document.getElementById('titleInput');
      const bodyInput = document.getElementById('bodyInput');
      const notesGrid = document.getElementById('notesGrid');

      if (!titleInput.value.trim() && !bodyInput.value.trim()) {
        alert('Escreva algo na nota antes de salvar!');
        return;
      }

      const card = document.createElement('div');
      card.className = 'note-card';
      card.innerHTML = `
        <div>
          <div class="note-title">${titleInput.value || 'Sem Título'}</div>
          <div class="note-body">${bodyInput.value}</div>
        </div>
        <div class="note-footer">
          <span>Agora mesmo</span>
          <button class="btn-delete" onclick="this.closest('.note-card').remove()">Excluir</button>
        </div>
      `;

      notesGrid.prepend(card);

      titleInput.value = '';
      bodyInput.value = '';
    }
  </script>
</body>
</html>
