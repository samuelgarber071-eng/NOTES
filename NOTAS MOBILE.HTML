<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notas do Livro - Tablet 10.1"</title>
    <style>
        :root {
            --bg-sidebar: #1e1f22;
            --bg-main: #2b2d31;
            --bg-input: #383a40;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --border-color: #3f4147;
            --accent-green: #23a55a;
            --accent-blue: #5865f2;
            --accent-red: #da373c;
            --accent-yellow: #f0b232;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- BARRA SUPERIOR PARA TABLET --- */
        .topbar-tablet {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 55px;
            background-color: var(--bg-sidebar);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid var(--border-color);
            z-index: 80;
        }

        .btn-menu-toggle {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .titulo-app {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
        }

        /* --- SIDEBAR (BARRA LATERAL ADAPTÁVEL) --- */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 15px;
            border-right: 1px solid var(--border-color);
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
        }

        .botoes-topo {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-nova-pasta {
            flex: 1;
            background-color: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }

        /* --- BACKUP CONTAINER --- */
        .backup-container {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
        }

        .btn-backup {
            flex: 1;
            background-color: var(--bg-input);
            color: var(--text-main);
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        .file-input-label { display: block; text-align: center; }
        input[type="file"] { display: none; }

        .section-title {
            font-size: 11px;
            font-weight: bold;
            color: var(--text-muted);
            margin: 10px 0 6px 4px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .lista-pastas {
            overflow-y: auto;
            margin-bottom: 10px;
        }

        #lista-fixados { flex: none; max-height: 200px; }
        #lista-comuns { flex: 1; }

        /* --- ESTRUTURA DE COLEÇÕES E SUB-NOTAS --- */
        .container-pasta {
            margin-bottom: 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 4px;
        }

        .item-pasta {
            padding: 10px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
        }

        .info-pasta {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 55%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .contador-sub {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 2px 7px;
            border-radius: 10px;
        }

        .lista-subnotas {
            margin-left: 12px;
            border-left: 2px solid var(--border-color);
            padding-left: 6px;
            margin-top: 4px;
        }

        .item-subnota {
            padding: 10px 8px;
            margin: 3px 0;
            border-radius: 6px;
            background: rgba(0,0,0,0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
        }

        .item-subnota.ativa {
            background-color: rgba(88, 101, 242, 0.25);
            border: 1px solid var(--accent-blue);
        }

        .item-subnota span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 75%; }

        .btn-actions-group {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            background: var(--bg-input);
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 13px;
            padding: 6px 8px;
            border-radius: 6px;
        }

        .btn-pin.fixado { color: var(--accent-yellow); background: rgba(240, 178, 50, 0.15); }

        /* --- ÁREA PRINCIPAL DO EDITOR --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 25px;
            padding-top: 75px;
            background-color: var(--bg-main);
            height: 100%;
            overflow-y: auto;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .fonte-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-sidebar);
            padding: 10px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }

        .fonte-control input[type="range"] {
            accent-color: var(--accent-blue);
            width: 40%;
            cursor: pointer;
        }

        .input-titulo {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
            outline: none;
            width: 100%;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .textarea-conteudo {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            line-height: 1.6;
            outline: none;
            resize: none;
            flex: 1;
            width: 100%;
            font-family: 'Georgia', serif;
        }

        .aviso-vazio {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 16px;
            text-align: center;
            line-height: 1.6;
        }

        .aviso-vazio span {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* --- RESPONSIVIDADE ESPECÍFICA DE 10.1 POLEGADAS --- */
        
        /* MODO RETRATO (Portrait: largura < 900px) */
        @media (max-width: 900px) {
            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                transform: translateX(-100%);
            }
            .sidebar.aberta {
                transform: translateX(0);
                box-shadow: 5px 0 20px rgba(0,0,0,0.5);
            }
        }

        /* MODO PAISAGEM (Landscape: largura >= 901px) */
        @media (min-width: 901px) {
            .topbar-tablet { display: none; }
            .main-content { padding-top: 25px; }
            .sidebar {
                position: relative;
                transform: none !important;
            }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    </style>
</head>
<body>

    <div class="topbar-tablet">
        <button class="btn-menu-toggle" onclick="toggleSidebar()">☰ Menu Coleções</button>
        <div class="titulo-app">Notas do Livro</div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="botoes-topo">
            <button class="btn-nova-pasta" onclick="criarNovaPasta()">📁 + Nova Coleção</button>
        </div>

        <div class="backup-container">
            <button class="btn-backup" onclick="exportarBackup()">💾 Exportar (.json)</button>
            <label class="btn-backup file-input-label">
                📂 Importar
                <input type="file" id="input-backup" accept=".json" onchange="importarBackup(event)">
            </label>
        </div>

        <div class="section-title" id="titulo-fixados">Fixados (0/3)</div>
        <div class="lista-pastas" id="lista-fixados"></div>

        <div class="section-title">Minhas Coleções / Pastas</div>
        <div class="lista-pastas" id="lista-comuns"></div>

        <div class="section-title">Lixeira (Sub-notas)</div>
        <div class="lista-notas" id="lista-lixeira" style="max-height: 120px; overflow-y: auto;"></div>
    </div>

    <div class="main-content">
        <div class="editor-container" id="editor" style="display: none;">
            <div class="fonte-control">
                <span>Tamanho da Fonte:</span>
                <input type="range" id="alterar-fonte" min="14" max="32" value="18" oninput="mudarTamanhoFonte(this.value)">
                <span id="valor-fonte">18px</span>
            </div>

            <input type="text" id="nota-titulo" class="input-titulo" placeholder="Título da sub-nota..." oninput="salvarSubNotaAtual()">
            <textarea id="nota-conteudo" class="textarea-conteudo" placeholder="Escreva as notas do seu livro aqui..." oninput="salvarSubNotaAtual()"></textarea>
        </div>
        
        <div class="aviso-vazio" id="aviso-vazio">
            <span>📖</span>
            Selecione uma sub-nota no painel lateral ou crie uma nova coleção para começar.
        </div>
    </div>

    <script>
        let pastas = JSON.parse(localStorage.getItem('livro_pastas_sistema'));
        
        if (!pastas) {
            let notasAntigas = JSON.parse(localStorage.getItem('livro_notas'));
            if (notasAntigas && notasAntigas.length > 0) {
                pastas = [{
                    id: "padrao",
                    titulo: "Minhas Notas",
                    fixada: false,
                    subnotas: notasAntigas.map(n => ({
                        id: n.id,
                        titulo: n.titulo,
                        conteudo: n.conteudo,
                        naLixeira: n.naLixeira || false
                    }))
                }];
            } else {
                pastas = [];
            }
        }

        let idPastaAtiva = null;
        let idSubNotaAtiva = null;
        let tamanhoFonteSalvo = localStorage.getItem('preferencia_fonte') || '18';

        renderizarInterface();
        mudarTamanhoFonte(tamanhoFonteSalvo);

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('aberta');
        }

        function fecharSidebarMobile() {
            if (window.innerWidth <= 900) {
                document.getElementById('sidebar').classList.remove('aberta');
            }
        }

        function criarNovaPasta() {
            const nomePasta = prompt("Nome da nova coleção/pasta:", "Nova Coleção");
            if (!nomePasta) return;

            const novaPasta = {
                id: Date.now().toString(),
                titulo: nomePasta,
                fixada: false,
                subnotas: []
            };
            pastas.unshift(novaPasta);
            salvarNoLocalStorage();
            renderizarInterface();
        }

        function criarSubNota(event, idPasta) {
            event.stopPropagation();
            const pasta = pastas.find(p => p.id === idPasta);
            if (!pasta) return;

            const novaSubNota = {
                id: Date.now().toString(),
                titulo: 'Nova Sub-nota',
                conteudo: '',
                naLixeira: false
            };

            pasta.subnotas.unshift(novaSubNota);
            salvarNoLocalStorage();
            idPastaAtiva = idPasta;
            carregarSubNota(idPasta, novaSubNota.id);
            fecharSidebarMobile();
        }

        function toggleFixarPasta(event, idPasta) {
            event.stopPropagation();
            const pasta = pastas.find(p => p.id === idPasta);
            if (!pasta) return;

            if (!pasta.fixada) {
                const totalFixadas = pastas.filter(p => p.fixada).length;
                if (totalFixadas >= 3) {
                    alert("Você só pode fixar no máximo 3 coleções!");
                    return;
                }
                pasta.fixada = true;
            } else {
                pasta.fixada = false;
            }

            salvarNoLocalStorage();
            renderizarInterface();
        }

        function renderizarInterface() {
            const containerFixados = document.getElementById('lista-fixados');
            const containerComuns = document.getElementById('lista-comuns');
            const containerLixeira = document.getElementById('lista-lixeira');
            
            containerFixados.innerHTML = '';
            containerComuns.innerHTML = '';
            containerLixeira.innerHTML = '';

            let qtdFixados = 0;

            pastas.forEach(pasta => {
                if (pasta.fixada) qtdFixados++;

                const divPastaContainer = document.createElement('div');
                divPastaContainer.className = 'container-pasta';

                const subNotasAtivas = pasta.subnotas.filter(sn => !sn.naLixeira);

                const divPasta = document.createElement('div');
                divPasta.className = `item-pasta`;
                divPasta.innerHTML = `
                    <div class="info-pasta">
                        <span>📁</span>
                        <span title="${pasta.titulo}">${pasta.titulo}</span>
                        <span class="contador-sub">${subNotasAtivas.length}</span>
                    </div>
                    <div class="btn-actions-group">
                        <button class="btn-action btn-pin ${pasta.fixada ? 'fixado' : ''}" onclick="toggleFixarPasta(event, '${pasta.id}')">📌</button>
                        <button class="btn-action" onclick="criarSubNota(event, '${pasta.id}')">➕</button>
                        <button class="btn-action" onclick="excluirPasta(event, '${pasta.id}')">🗑️</button>
                    </div>
                `;
                divPastaContainer.appendChild(divPasta);

                if (subNotasAtivas.length > 0) {
                    const divListaSub = document.createElement('div');
                    divListaSub.className = 'lista-subnotas';

                    subNotasAtivas.forEach(sub => {
                        const divSub = document.createElement('div');
                        divSub.className = `item-subnota ${sub.id === idSubNotaAtiva ? 'ativa' : ''}`;
                        divSub.onclick = () => {
                            carregarSubNota(pasta.id, sub.id);
                            fecharSidebarMobile();
                        };
                        divSub.innerHTML = `
                            <span>📄 ${sub.titulo || 'Sem título'}</span>
                            <button class="btn-action" style="background:transparent" onclick="moverSubParaLixeira(event, '${pasta.id}', '${sub.id}')">🗑️</button>
                        `;
                        divListaSub.appendChild(divSub);
                    });
                    divPastaContainer.appendChild(divListaSub);
                }

                if (pasta.fixada) {
                    containerFixados.appendChild(divPastaContainer);
                } else {
                    containerComuns.appendChild(divPastaContainer);
                }

                pasta.subnotas.forEach(sub => {
                    if (sub.naLixeira) {
                        const itemLixo = document.createElement('div');
                        itemLixo.className = 'item-subnota';
                        itemLixo.style.justifyContent = 'space-between';
                        itemLixo.innerHTML = `
                            <span style="color: var(--text-muted); text-decoration: line-through; font-size:12px;">${sub.titulo}</span>
                            <div class="btn-actions-group">
                                <button class="btn-action" onclick="restaurarSubNota('${pasta.id}', '${sub.id}')">↩️</button>
                                <button class="btn-action" onclick="excluirSubPermanente('${pasta.id}', '${sub.id}')">❌</button>
                            </div>
                        `;
                        containerLixeira.appendChild(itemLixo);
                    }
                });
            });

            document.getElementById('titulo-fixados').innerText = `Fixados (${qtdFixados}/3)`;
        }

        function carregarSubNota(idPasta, idSub) {
            const pasta = pastas.find(p => p.id === idPasta);
            if (!pasta) return;
            const sub = pasta.subnotas.find(sn => sn.id === idSub);
            if (!sub || sub.naLixeira) {
                fecharEditor();
                return;
            }

            idPastaAtiva = idPasta;
            idSubNotaAtiva = idSub;

            document.getElementById('aviso-vazio').style.display = 'none';
            document.getElementById('editor').style.display = 'flex';

            document.getElementById('nota-titulo').value = sub.titulo;
            document.getElementById('nota-conteudo').value = sub.conteudo;

            renderizarInterface();
        }

        function salvarSubNotaAtual() {
            if (!idPastaAtiva || !idSubNotaAtiva) return;

            const pasta = pastas.find(p => p.id === idPastaAtiva);
            if (pasta) {
                const sub = pasta.subnotas.find(sn => sn.id === idSubNotaAtiva);
                if (sub) {
                    sub.titulo = document.getElementById('nota-titulo').value;
                    sub.conteudo = document.getElementById('nota-conteudo').value;
                    salvarNoLocalStorage();
                    
                    const elementoSub = document.querySelector(`.item-subnota.ativa span`);
                    if (elementoSub) elementoSub.innerText = '📄 ' + (sub.titulo || 'Sem título');
                }
            }
        }

        function moverSubParaLixeira(event, idPasta, idSub) {
            event.stopPropagation();
            const pasta = pastas.find(p => p.id === idPasta);
            if (pasta) {
                const sub = pasta.subnotas.find(sn => sn.id === idSub);
                if (sub) {
                    sub.naLixeira = true;
                    if (idSubNotaAtiva === idSub) fecharEditor();
                    salvarNoLocalStorage();
                    renderizarInterface();
                }
            }
        }

        function restaurarSubNota(idPasta, idSub) {
            const pasta = pastas.find(p => p.id === idPasta);
            if (pasta) {
                const sub = pasta.subnotas.find(sn => sn.id === idSub);
                if (sub) {
                    sub.naLixeira = false;
                    salvarNoLocalStorage();
                    carregarSubNota(idPasta, idSub);
                }
            }
        }

        function excluirSubPermanente(idPasta, idSub) {
            if (confirm("Excluir permanentemente esta sub-nota?")) {
                const pasta = pastas.find(p => p.id === idPasta);
                if (pasta) {
                    pasta.subnotas = pasta.subnotas.filter(sn => sn.id !== idSub);
                    salvarNoLocalStorage();
                    renderizarInterface();
                }
            }
        }

        function excluirPasta(event, idPasta) {
            event.stopPropagation();
            if (confirm("Deseja apagar esta pasta e todas as suas sub-notas?")) {
                pastas = pastas.filter(p => p.id !== idPasta);
                if (idPastaAtiva === idPasta) fecharEditor();
                salvarNoLocalStorage();
                renderizarInterface();
            }
        }

        function fecharEditor() {
            idSubNotaAtiva = null;
            document.getElementById('editor').style.display = 'none';
            document.getElementById('aviso-vazio').style.display = 'flex';
            renderizarInterface();
        }

        function salvarNoLocalStorage() {
            localStorage.setItem('livro_pastas_sistema', JSON.stringify(pastas));
        }

        function mudarTamanhoFonte(valor) {
            const caixaTexto = document.getElementById('nota-conteudo');
            if (caixaTexto) caixaTexto.style.fontSize = valor + 'px';
            document.getElementById('valor-fonte').innerText = valor + 'px';
            document.getElementById('alterar-fonte').value = valor;
            localStorage.setItem('preferencia_fonte', valor);
        }

        function exportarBackup() {
            if (pastas.length === 0) {
                alert("Nenhum dado para exportar.");
                return;
            }
            const dadosStr = JSON.stringify(pastas, null, 2);
            const blob = new Blob([dadosStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `backup_tablet_${new Date().toISOString().slice(0, 10)}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importarBackup(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            const leitor = new FileReader();
            leitor.onload = function(e) {
                try {
                    const dados = JSON.parse(e.target.result);
                    if (Array.isArray(dados)) {
                        pastas = dados;
                        salvarNoLocalStorage();
                        fecharEditor();
                        renderizarInterface();
                        alert("Backup importado com sucesso!");
                    } else {
                        alert("Formato inválido.");
                    }
                } catch (err) {
                    alert("Erro ao ler arquivo.");
                }
                event.target.value = '';
            };
            leitor.readAsText(arquivo);
        }
    </script>
</body>
</html>
