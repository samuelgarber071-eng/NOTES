<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas do Livro - Sistema de Coleções e Sub-notas</title>
    <style>
        :root {
            --bg-sidebar: #1e1f22;
            --bg-main: #2b2d31;
            --bg-input: #383a40;
            --bg-hover: rgba(255, 255, 255, 0.06);
            --bg-active: rgba(88, 101, 242, 0.18);
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --border-color: #3f4147;
            --accent-green: #23a55a;
            --accent-blue: #5865f2;
            --accent-red: #da373c;
            --accent-yellow: #f0b232;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- SIDEBAR (Barra Lateral) --- */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            border-right: 1px solid var(--border-color);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .sidebar.escondida {
            margin-left: -320px;
        }

        .btn-nova-pasta {
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            margin-bottom: 14px;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }

        .btn-nova-pasta:hover {
            background-color: #4752c4;
        }

        .btn-nova-pasta:active {
            transform: scale(0.98);
        }

        /* --- ÁREA DE BACKUP --- */
        .backup-container {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: var(--radius-md);
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-backup {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s ease;
            display: block;
            width: 100%;
        }

        .btn-backup.exportar:hover {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .btn-backup.importar:hover {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .file-input-label {
            display: block;
            text-align: center;
        }

        input[type="file"] {
            display: none;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 10px 0 6px 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .lista-pastas {
            overflow-y: auto;
            margin-bottom: 10px;
            padding-right: 2px;
        }

        #lista-fixados { flex: none; max-height: 200px; }
        #lista-comuns { flex: 1; }

        /* --- PASTAS E SUB-NOTAS --- */
        .container-pasta {
            margin-bottom: 8px;
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 4px;
        }

        .item-pasta {
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 14px;
            border-radius: 6px;
        }

        .item-pasta:hover {
            background-color: var(--bg-hover);
        }

        .info-pasta {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 60%;
        }

        .contador-sub {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 2px 7px;
            border-radius: 10px;
        }

        .lista-subnotas {
            margin-left: 12px;
            border-left: 2px solid var(--border-color);
            padding-left: 6px;
            margin-top: 4px;
        }

        .item-subnota {
            padding: 8px 10px;
            margin: 3px 0;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            transition: background-color 0.15s ease;
            border: 1px solid transparent;
        }

        .item-subnota:hover {
            background-color: var(--bg-hover);
        }

        .item-subnota.ativa {
            background-color: var(--bg-active);
            color: #ffffff;
            border-color: rgba(88, 101, 242, 0.4);
        }

        .item-subnota span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 75%;
        }

        .btn-action {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 3px 5px;
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .btn-action:hover {
            background-color: var(--bg-input);
            color: var(--text-main);
        }

        .btn-delete:hover {
            color: var(--accent-red);
            background-color: rgba(218, 55, 60, 0.15);
        }

        .btn-pin.fixado {
            color: var(--accent-yellow);
        }

        .btn-pin:hover {
            color: var(--accent-yellow);
            background-color: rgba(240, 178, 50, 0.15);
        }

        /* --- BOTÃO FLUTUANTE SIDEBAR --- */
        .btn-toggle-sidebar {
            position: absolute;
            top: 18px;
            left: 18px;
            background-color: var(--bg-sidebar);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            z-index: 100;
            font-size: 13px;
            font-weight: 600;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s, border-color 0.2s;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        body:not(.sidebar-recuada) .btn-toggle-sidebar {
            left: 335px;
        }

        .btn-toggle-sidebar:hover {
            background-color: var(--bg-input);
            border-color: var(--text-muted);
        }

        /* --- ÁREA PRINCIPAL --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
            padding-top: 80px;
            background-color: var(--bg-main);
            transition: padding-left 0.3s ease;
            height: 100vh;
            overflow: hidden;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        .header-editor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-salvamento {
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
        }

        .fonte-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .fonte-control input[type="range"] {
            accent-color: var(--accent-blue);
            cursor: pointer;
            width: 90px;
        }

        .input-titulo {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 20px;
            outline: none;
            width: 100%;
            letter-spacing: -0.5px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }

        .input-titulo:focus {
            border-bottom-color: var(--border-color);
        }

        .textarea-conteudo {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Georgia', serif;
            font-size: 18px;
            line-height: 1.7;
            outline: none;
            resize: none;
            flex: 1;
            width: 100%;
            padding-right: 10px;
        }

        .aviso-vazio {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 16px;
            text-align: center;
            line-height: 1.6;
            gap: 12px;
        }

        .aviso-vazio .icone-vazio {
            font-size: 48px;
            opacity: 0.6;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>

    <button class="btn-toggle-sidebar" id="toggle-btn" onclick="toggleSidebar()">
        <span>☰</span> <span>Barra Lateral</span>
    </button>

    <div class="sidebar" id="sidebar">
        <button class="btn-nova-pasta" onclick="criarNovaPasta()">
            <span>📁</span> <span>+ Nova Coleção</span>
        </button>

        <div class="backup-container">
            <button class="btn-backup exportar" onclick="exportarBackup()">💾 Exportar Backup (.json)</button>
            <label class="btn-backup importar file-input-label">
                📂 Importar Backup
                <input type="file" id="input-backup" accept=".json" onchange="importarBackup(event)">
            </label>
        </div>

        <div class="section-title" id="titulo-fixados">Fixados (0/3)</div>
        <div class="lista-pastas" id="lista-fixados"></div>

        <div class="section-title">Minhas Coleções / Pastas</div>
        <div class="lista-pastas" id="lista-comuns"></div>

        <div class="section-title">Lixeira (Sub-notas)</div>
        <div class="lista-notas" id="lista-lixeira" style="max-height: 130px; overflow-y: auto;"></div>
    </div>

    <div class="main-content">
        <div class="editor-container" id="editor" style="display: none;">
            <div class="header-editor">
                <span class="status-salvamento" id="status-salvamento">Salvo automaticamente</span>
                <div class="fonte-control">
                    <span>A-</span>
                    <input type="range" id="alterar-fonte" min="14" max="32" value="18" oninput="mudarTamanhoFonte(this.value)">
                    <span>A+</span>
                    <span id="valor-fonte">18px</span>
                </div>
            </div>

            <input type="text" id="nota-titulo" class="input-titulo" placeholder="Título da sub-nota..." oninput="salvarSubNotaAtual()">
            <textarea id="nota-conteudo" class="textarea-conteudo" placeholder="Comece a escrever o conteúdo da sub-nota aqui..." oninput="salvarSubNotaAtual()"></textarea>
        </div>

        <div class="aviso-vazio" id="aviso-vazio">
            <div class="icone-vazio">📚</div>
            <div>Crie uma Coleção utilizando o botão acima,<br>adicione sub-notas no botão ➕ e selecione-as para começar.</div>
        </div>
    </div>

    <script>
        // Migração automática e carregamento de dados do localStorage
        let pastas = JSON.parse(localStorage.getItem('livro_pastas_sistema'));

        if (!pastas) {
            let notasAntigas = JSON.parse(localStorage.getItem('livro_notas'));
            if (notasAntigas && notasAntigas.length > 0) {
                pastas = [{
                    id: "padrao",
                    titulo: "Minhas Notas",
                    fixada: false,
                    subnotas: notasAntigas.map(n => ({
                        id: n.id,
                        titulo: n.titulo,
                        conteudo: n.conteudo,
                        naLixeira: n.naLixeira || false
                    }))
                }];
            } else {
                pastas = [];
            }
        }

        let idPastaAtiva = null;
        let idSubNotaAtiva = null;
        let tamanhoFonteSalvo = localStorage.getItem('preferencia_fonte') || '18';

        renderizarInterface();
        mudarTamanhoFonte(tamanhoFonteSalvo);

        function criarNovaPasta() {
            const nomePasta = prompt("Digite o nome da nova coleção/pasta:", "Nova Coleção");
            if (!nomePasta) return;

            const novaPasta = {
                id: Date.now().toString(),
                titulo: nomePasta,
                fixada: false,
                subnotas: []
            };
            pastas.unshift(novaPasta);
            salvarNoLocalStorage();
            renderizarInterface();
        }

        function criarSubNota(event, idPasta) {
            event.stopPropagation();
            const pasta = pastas.find(p => p.id === idPasta);
            if (!pasta) return;

            const novaSubNota = {
                id: Date.now().toString(),
                titulo: 'Nova Sub-nota',
                conteudo: '',
                naLixeira: false
            };

            pasta.subnotas.unshift(novaSubNota);
            salvarNoLocalStorage();
            carregarSubNota(idPasta, novaSubNota.id);
        }

        function toggleFixarPasta(event, idPasta) {
            event.stopPropagation();
            const pasta = pastas.find(p => p.id === idPasta);
            if (!pasta) return;

            if (!pasta.fixada) {
                const totalFixadas = pastas.filter(p => p.fixada).length;
                if (totalFixadas >= 3) {
                    alert("Você só pode fixar no máximo 3 coleções!");
                    return;
                }
                pasta.fixada = true;
            } else {
                pasta.fixada = false;
            }

            salvarNoLocalStorage();
            renderizarInterface();
        }

        function renderizarInterface() {
            const containerFixados = document.getElementById('lista-fixados');
            const containerComuns = document.getElementById('lista-comuns');
            const containerLixeira = document.getElementById('lista-lixeira');
            
            containerFixados.innerHTML = '';
            containerComuns.innerHTML = '';
            containerLixeira.innerHTML = '';

            let qtdFixados = 0;

            pastas.forEach(pasta => {
                if (pasta.fixada) qtdFixados++;

                const divPastaContainer = document.createElement('div');
                divPastaContainer.className = 'container-pasta';

                const subNotasAtivas = pasta.subnotas.filter(sn => !sn.naLixeira);

                const divPasta = document.createElement('div');
                divPasta.className = `item-pasta ${pasta.id === idPastaAtiva ? 'ativa' : ''}`;
                divPasta.innerHTML = `
                    <div class="info-pasta">
                        <span>📁</span>
                        <span title="${pasta.titulo}">${pasta.titulo}</span>
                        <span class="contador-sub">${subNotasAtivas.length}</span>
                    </div>
                    <div>
                        <button class="btn-action btn-pin ${pasta.fixada ? 'fixado' : ''}" title="${pasta.fixada ? 'Desafixar' : 'Fixar no topo (Máx 3)'}" onclick="toggleFixarPasta(event, '${pasta.id}')">📌</button>
                        <button class="btn-action" title="Adicionar Sub-nota" onclick="criarSubNota(event, '${pasta.id}')">➕</button>
                        <button class="btn-action btn-delete" title="Excluir Pasta Inteira" onclick="excluirPasta(event, '${pasta.id}')">🗑️</button>
                    </div>
                `;
                divPastaContainer.appendChild(divPasta);

                if (subNotasAtivas.length > 0) {
                    const divListaSub = document.createElement('div');
                    divListaSub.className = 'lista-subnotas';

                    subNotasAtivas.forEach(sub => {
                        const divSub = document.createElement('div');
                        divSub.className = `item-subnota ${sub.id === idSubNotaAtiva ? 'ativa' : ''}`;
                        divSub.onclick = () => carregarSubNota(pasta.id, sub.id);
                        divSub.innerHTML = `
                            <span title="${sub.titulo}">📄 ${sub.titulo || 'Sem título'}</span>
                            <button class="btn-action btn-delete" title="Mover para lixeira" onclick="moverSubParaLixeira(event, '${pasta.id}', '${sub.id}')">🗑️</button>
                        `;
                        divListaSub.appendChild(divSub);
                    });
                    divPastaContainer.appendChild(divListaSub);
                }

                if (pasta.fixada) {
                    containerFixados.appendChild(divPastaContainer);
                } else {
                    containerComuns.appendChild(divPastaContainer);
                }

                pasta.subnotas.forEach(sub => {
                    if (sub.naLixeira) {
                        const itemLixo = document.createElement('div');
                        itemLixo.className = 'item-subnota';
                        itemLixo.style.justifyContent = 'space-between';
                        itemLixo.innerHTML = `
                            <span style="color: var(--text-muted); text-decoration: line-through; font-size:12px;">${sub.titulo} (${pasta.titulo})</span>
                            <div style="display: flex; gap: 2px;">
                                <button class="btn-action" title="Restaurar" onclick="restaurarSubNota('${pasta.id}', '${sub.id}')">↩️</button>
                                <button class="btn-action btn-delete" title="Apagar Permanentemente" onclick="excluirSubPermanente('${pasta.id}', '${sub.id}')">❌</button>
                            </div>
                        `;
                        containerLixeira.appendChild(itemLixo);
                    }
                });
            });

            document.getElementById('titulo-fixados').innerText = `Fixados (${qtdFixados}/3)`;
        }

        function carregarSubNota(idPasta, idSub) {
            const pasta = pastas.find(p => p.id === idPasta);
            if (!pasta) return;
            const sub = pasta.subnotas.find(sn => sn.id === idSub);
            if (!sub || sub.naLixeira) {
                fecharEditor();
                return;
            }

            idPastaAtiva = idPasta;
            idSubNotaAtiva = idSub;

            document.getElementById('aviso-vazio').style.display = 'none';
            document.getElementById('editor').style.display = 'flex';

            document.getElementById('nota-titulo').value = sub.titulo;
            document.getElementById('nota-conteudo').value = sub.conteudo;

            renderizarInterface();
        }

        function salvarSubNotaAtual() {
            if (!idPastaAtiva || !idSubNotaAtiva) return;

            const pasta = pastas.find(p => p.id === idPastaAtiva);
            if (pasta) {
                const sub = pasta.subnotas.find(sn => sn.id === idSubNotaAtiva);
                if (sub) {
                    sub.titulo = document.getElementById('nota-titulo').value;
                    sub.conteudo = document.getElementById('nota-conteudo').value;
                    salvarNoLocalStorage();
                    
                    const elementoSub = document.querySelector(`.item-subnota.ativa span`);
                    if (elementoSub) elementoSub.innerText = '📄 ' + (sub.titulo || 'Sem título');

                    const status = document.getElementById('status-salvamento');
                    if (status) {
                        status.innerText = 'Salvando...';
                        setTimeout(() => { status.innerText = 'Salvo automaticamente'; }, 400);
                    }
                }
            }
        }

        function moverSubParaLixeira(event, idPasta, idSub) {
            event.stopPropagation();
            const pasta = pastas.find(p => p.id === idPasta);
            if (pasta) {
                const sub = pasta.subnotas.find(sn => sn.id === idSub);
                if (sub) {
                    sub.naLixeira = true;
                    if (idSubNotaAtiva === idSub) fecharEditor();
                    salvarNoLocalStorage();
                    renderizarInterface();
                }
            }
        }

        function restaurarSubNota(idPasta, idSub) {
            const pasta = pastas.find(p => p.id === idPasta);
            if (pasta) {
                const sub = pasta.subnotas.find(sn => sn.id === idSub);
                if (sub) {
                    sub.naLixeira = false;
                    salvarNoLocalStorage();
                    carregarSubNota(idPasta, idSub);
                }
            }
        }

        function excluirSubPermanente(idPasta, idSub) {
            if (confirm("Excluir permanentemente esta sub-nota?")) {
                const pasta = pastas.find(p => p.id === idPasta);
                if (pasta) {
                    pasta.subnotas = pasta.subnotas.filter(sn => sn.id !== idSub);
                    salvarNoLocalStorage();
                    renderizarInterface();
                }
            }
        }

        function excluirPasta(event, idPasta) {
            event.stopPropagation();
            if (confirm("Deseja apagar esta pasta e todas as suas sub-notas?")) {
                pastas = pastas.filter(p => p.id !== idPasta);
                if (idPastaAtiva === idPasta) fecharEditor();
                salvarNoLocalStorage();
                renderizarInterface();
            }
        }

        function fecharEditor() {
            idSubNotaAtiva = null;
            document.getElementById('editor').style.display = 'none';
            document.getElementById('aviso-vazio').style.display = 'flex';
            renderizarInterface();
        }

        function salvarNoLocalStorage() {
            localStorage.setItem('livro_pastas_sistema', JSON.stringify(pastas));
        }

        function mudarTamanhoFonte(valor) {
            const caixaTexto = document.getElementById('nota-conteudo');
            if (caixaTexto) caixaTexto.style.fontSize = valor + 'px';
            document.getElementById('valor-fonte').innerText = valor + 'px';
            document.getElementById('alterar-fonte').value = valor;
            localStorage.setItem('preferencia_fonte', valor);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('escondida');
            document.body.classList.toggle('sidebar-recuada');
        }

        function exportarBackup() {
            if (pastas.length === 0) {
                alert("Nenhum dado para exportar.");
                return;
            }
            const dadosStr = JSON.stringify(pastas, null, 2);
            const blob = new Blob([dadosStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `backup_colecoes_${new Date().toISOString().slice(0, 10)}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importarBackup(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            const leitor = new FileReader();
            leitor.onload = function(e) {
                try {
                    const dados = JSON.parse(e.target.result);
                    if (Array.isArray(dados)) {
                        pastas = dados;
                        salvarNoLocalStorage();
                        fecharEditor();
                        renderizarInterface();
                        alert("Backup de coleções importado com sucesso!");
                    } else {
                        alert("Formato inválido.");
                    }
                } catch (err) {
                    alert("Erro ao ler arquivo.");
                }
                event.target.value = '';
            };
            leitor.readAsText(arquivo);
        }
    </script>
