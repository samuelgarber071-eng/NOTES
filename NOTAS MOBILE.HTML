<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas do Livro - Completo</title>
    <style>
        :root {
            --bg-sidebar: #1e1f22;
            --bg-main: #2b2d31;
            --bg-input: #383a40;
            --bg-hover: rgba(255, 255, 255, 0.06);
            --bg-active: rgba(88, 101, 242, 0.15);
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --border-color: #3f4147;
            --accent-green: #23a55a;
            --accent-blue: #5865f2;
            --accent-red: #da373c;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- SIDEBAR (Barra Lateral) --- */
        .sidebar {
            width: 300px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            border-right: 1px solid var(--border-color);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .sidebar.escondida {
            margin-left: -300px;
        }

        .btn-nova-nota {
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            margin-bottom: 16px;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }

        .btn-nova-nota:hover {
            background-color: #4752c4;
        }

        .btn-nova-nota:active {
            transform: scale(0.98);
        }

        /* --- ÁREA DE BACKUP --- */
        .backup-container {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-backup {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s ease;
            display: block;
            width: 100%;
        }

        .btn-backup.exportar:hover {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .btn-backup.importar:hover {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .file-input-label {
            display: block;
            text-align: center;
        }

        input[type="file"] {
            display: none;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 12px 0 6px 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .lista-notas {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 2px;
        }

        .item-nota {
            padding: 10px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.15s ease, color 0.15s ease;
            border: 1px solid transparent;
        }

        .item-nota:hover {
            background-color: var(--bg-hover);
        }

        .item-nota.ativa {
            background-color: var(--bg-active);
            color: #ffffff;
            border-color: rgba(88, 101, 242, 0.4);
        }

        .item-nota span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 78%;
        }

        .btn-action {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 4px 6px;
            border-radius: 4px;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action:hover {
            background-color: var(--bg-input);
            color: var(--text-main);
        }

        .btn-delete:hover {
            color: var(--accent-red);
            background-color: rgba(218, 55, 60, 0.15);
        }

        .btn-restore:hover {
            color: var(--accent-green);
            background-color: rgba(35, 165, 90, 0.15);
        }

        /* --- BOTÃO FLUTUANTE SIDEBAR --- */
        .btn-toggle-sidebar {
            position: absolute;
            top: 18px;
            left: 18px;
            background-color: var(--bg-sidebar);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            z-index: 100;
            font-size: 13px;
            font-weight: 600;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s, border-color 0.2s;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        body:not(.sidebar-recuada) .btn-toggle-sidebar {
            left: 315px;
        }

        .btn-toggle-sidebar:hover {
            background-color: var(--bg-input);
            border-color: var(--text-muted);
        }

        /* --- ÁREA PRINCIPAL --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
            padding-top: 80px;
            background-color: var(--bg-main);
            transition: padding-left 0.3s ease;
            height: 100vh;
            overflow: hidden;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        .header-editor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-salvamento {
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
        }

        .fonte-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .fonte-control input[type="range"] {
            accent-color: var(--accent-blue);
            cursor: pointer;
            width: 90px;
        }

        .input-titulo {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 20px;
            outline: none;
            width: 100%;
            letter-spacing: -0.5px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }

        .input-titulo:focus {
            border-bottom-color: var(--border-color);
        }

        .textarea-conteudo {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Georgia', serif;
            font-size: 18px;
            line-height: 1.7;
            outline: none;
            resize: none;
            flex: 1;
            width: 100%;
            padding-right: 10px;
        }

        .aviso-vazio {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 16px;
            text-align: center;
            line-height: 1.6;
            gap: 12px;
        }

        .aviso-vazio .icone-vazio {
            font-size: 48px;
            opacity: 0.6;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>

    <button class="btn-toggle-sidebar" id="toggle-btn" onclick="toggleSidebar()">
        <span>☰</span> <span>Barra Lateral</span>
    </button>

    <div class="sidebar" id="sidebar">
        <button class="btn-nova-nota" onclick="criarNovaNota()">
            <span>➕</span> <span>Nova nota</span>
        </button>

        <div class="backup-container">
            <button class="btn-backup exportar" onclick="exportarBackup()">💾 Exportar Backup (.json)</button>
            <label class="btn-backup importar file-input-label">
                📂 Importar Backup
                <input type="file" id="input-backup" accept=".json" onchange="importarBackup(event)">
            </label>
        </div>

        <div class="section-title">Minhas Notas</div>
        <div class="lista-notas" id="lista-ativas"></div>

        <div class="section-title">Lixeira</div>
        <div class="lista-notas" id="lista-lixeira" style="max-height: 160px; flex: none;"></div>
    </div>

    <div class="main-content">
        <div class="editor-container" id="editor" style="display: none;">
            <div class="header-editor">
                <span class="status-salvamento" id="status-salvamento">Salvo automaticamente</span>
                <div class="fonte-control">
                    <span>A-</span>
                    <input type="range" id="alterar-fonte" min="14" max="32" value="18" oninput="mudarTamanhoFonte(this.value)">
                    <span>A+</span>
                    <span id="valor-fonte">18px</span>
                </div>
            </div>

            <input type="text" id="nota-titulo" class="input-titulo" placeholder="Título da nota..." oninput="salvarNotaAtual()">
            <textarea id="nota-conteudo" class="textarea-conteudo" placeholder="Comece a escrever as informações do seu livro aqui..." oninput="salvarNotaAtual()"></textarea>
        </div>
        <div class="aviso-vazio" id="aviso-vazio">
            <div class="icone-vazio">📖</div>
            <div>Selecione uma nota na barra lateral<br>ou crie uma nova para começar a escrever.</div>
        </div>
    </div>

    <script>
        let notas = JSON.parse(localStorage.getItem('livro_notas')) || [];
        let idNotaAtiva = null;
        let tamanhoFonteSalvo = localStorage.getItem('preferencia_fonte') || '18';

        renderizarListas();
        mudarTamanhoFonte(tamanhoFonteSalvo);

        function criarNovaNota() {
            const novaNota = {
                id: Date.now().toString(),
                titulo: 'Nova Nota',
                conteudo: '',
                naLixeira: false
            };
            notas.unshift(novaNota);
            salvarNoLocalStorage();
            carregarNota(novaNota.id);
        }

        function renderizarListas() {
            const listaAtivas = document.getElementById('lista-ativas');
            const listaLixeira = document.getElementById('lista-lixeira');
            
            listaAtivas.innerHTML = '';
            listaLixeira.innerHTML = '';

            notas.forEach(nota => {
                const item = document.createElement('div');
                item.className = `item-nota ${nota.id === idNotaAtiva ? 'ativa' : ''}`;
                
                if (!nota.naLixeira) {
                    item.onclick = () => carregarNota(nota.id);
                    item.innerHTML = `
                        <span>📄 ${nota.titulo || 'Sem título'}</span>
                        <button class="btn-action btn-delete" title="Mover para a lixeira" onclick="moverParaLixeira(event, '${nota.id}')">🗑️</button>
                    `;
                    listaAtivas.appendChild(item);
                } else {
                    item.innerHTML = `
                        <span style="color: var(--text-muted); text-decoration: line-through;">${nota.titulo || 'Sem título'}</span>
                        <div style="display: flex; gap: 2px;">
                            <button class="btn-action btn-restore" title="Restaurar" onclick="restaurarDaLixeira(event, '${nota.id}')">↩️</button>
                            <button class="btn-action btn-delete" title="Excluir Permanentemente" onclick="excluirPermanente(event, '${nota.id}')">❌</button>
                        </div>
                    `;
                    listaLixeira.appendChild(item);
                }
            });
        }

        function carregarNota(id) {
            const nota = notas.find(n => n.id === id);
            if (!nota || nota.naLixeira) {
                fecharEditor();
                return;
            }

            idNotaAtiva = id;
            document.getElementById('aviso-vazio').style.display = 'none';
            document.getElementById('editor').style.display = 'flex';

            document.getElementById('nota-titulo').value = nota.titulo;
            document.getElementById('nota-conteudo').value = nota.conteudo;

            renderizarListas();
        }

        function salvarNotaAtual() {
            if (!idNotaAtiva) return;

            const nota = notas.find(n => n.id === idNotaAtiva);
            if (nota) {
                nota.titulo = document.getElementById('nota-titulo').value;
                nota.conteudo = document.getElementById('nota-conteudo').value;
                salvarNoLocalStorage();
                renderizarListas();
                
                const status = document.getElementById('status-salvamento');
                if (status) {
                    status.innerText = 'Salvando...';
                    setTimeout(() => { status.innerText = 'Salvo automaticamente'; }, 400);
                }
            }
        }

        function moverParaLixeira(event, id) {
            event.stopPropagation();
            const nota = notas.find(n => n.id === id);
            if (nota) {
                nota.naLixeira = true;
                if (idNotaAtiva === id) fecharEditor();
                salvarNoLocalStorage();
                renderizarListas();
            }
        }

        function restaurarDaLixeira(event, id) {
            event.stopPropagation();
            const nota = notas.find(n => n.id === id);
            if (nota) {
                nota.naLixeira = false;
                salvarNoLocalStorage();
                carregarNota(id);
            }
        }

        function excluirPermanente(event, id) {
            event.stopPropagation();
            if (confirm("Deseja excluir permanentemente esta nota? Esta ação não pode ser desfeita.")) {
                notas = notas.filter(n => n.id !== id);
                salvarNoLocalStorage();
                renderizarListas();
            }
        }

        function fecharEditor() {
            idNotaAtiva = null;
            document.getElementById('editor').style.display = 'none';
            document.getElementById('aviso-vazio').style.display = 'flex';
            renderizarListas();
        }

        function salvarNoLocalStorage() {
            localStorage.setItem('livro_notas', JSON.stringify(notas));
        }

        function mudarTamanhoFonte(valor) {
            const caixaTexto = document.getElementById('nota-conteudo');
            if (caixaTexto) {
                caixaTexto.style.fontSize = valor + 'px';
            }
            document.getElementById('valor-fonte').innerText = valor + 'px';
            document.getElementById('alterar-fonte').value = valor;
            localStorage.setItem('preferencia_fonte', valor);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const corpo = document.body;
            
            sidebar.classList.toggle('escondida');
            corpo.classList.toggle('sidebar-recuada');
        }

        function exportarBackup() {
            if (notas.length === 0) {
                alert("Você não possui notas para exportar.");
                return;
            }
            
            const dadosStr = JSON.stringify(notas, null, 2);
            const blob = new Blob([dadosStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const dataAtual = new Date().toISOString().slice(0, 10);
            const link = document.createElement('a');
            link.href = url;
            link.download = `backup_livro_${dataAtual}.json`;
            link.click();
            
            URL.revokeObjectURL(url);
        }

        function importarBackup(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            const leitor = new FileReader();
            leitor.onload = function(e) {
                try {
                    const notasImportadas = JSON.parse(e.target.result);
                    
                    if (Array.isArray(notasImportadas)) {
                        if (confirm("Deseja mesclar as notas importadas com as atuais? (Clique em Cancelar para substituir tudo).")) {
                            const idsExistentes = new Set(notas.map(n => n.id));
                            const novasFiltradas = notasImportadas.filter(n => !idsExistentes.has(n.id));
                            notas = [...novasFiltradas, ...notas];
                        } else {
                            notas = notasImportadas;
                        }
                        
                        salvarNoLocalStorage();
                        fecharEditor();
                        renderizarListas();
                        alert("Backup importado com sucesso!");
                    } else {
                        alert("Formato de arquivo inválido.");
                    }
                } catch (erro) {
                    alert("Erro ao ler o arquivo de backup.");
                }
                event.target.value = '';
            };
            leitor.readAsText(arquivo);
        }
    </script>
</body>
</html>
