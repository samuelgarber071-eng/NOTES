<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas do Livro - Interface Pro</title>
    <style>
        :root {
            --bg-body: #0b0f17;
            --bg-sidebar: #111827;
            --bg-main: #1f2937;
            --bg-card: #374151;
            --bg-input: #1f2937;
            
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;
            
            --border-color: #374151;
            --border-hover: #4b5563;
            
            --accent-primary: #6366f1;
            --accent-primary-hover: #4f46e5;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --transition-fast: 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- BOTÃO ALTERNAR SIDEBAR --- */
        .btn-toggle-sidebar {
            position: fixed;
            top: 16px;
            left: 16px;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            z-index: 100;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-md);
            transition: all var(--transition-fast);
        }

        .btn-toggle-sidebar:hover {
            background-color: var(--border-hover);
            transform: translateY(-1px);
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 300px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
            border-right: 1px solid var(--border-color);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 90;
            flex-shrink: 0;
        }

        .sidebar.escondida {
            margin-left: -300px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-left: 4px;
        }

        .sidebar-header h2 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-main);
        }

        .btn-nova-nota {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-hover));
            color: #ffffff;
            border: none;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-fast);
        }

        .btn-nova-nota:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        /* --- BACKUP CONTAINER --- */
        .backup-container {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
        }

        .btn-backup {
            flex: 1;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-backup:hover {
            background-color: var(--border-hover);
            border-color: var(--text-muted);
        }

        .file-input-label { display: block; }
        input[type="file"] { display: none; }

        /* --- LISTAS DE NOTAS --- */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px 4px 6px 4px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .section-count {
            font-size: 10px;
            background: var(--bg-card);
            color: var(--text-muted);
            padding: 2px 6px;
            border-radius: 10px;
        }

        .lista-notas {
            overflow-y: auto;
            margin-bottom: 10px;
            padding-right: 2px;
        }

        #lista-ativas {
            flex: 1;
        }

        #lista-lixeira {
            max-height: 140px;
            flex: none;
        }

        .item-nota {
            padding: 10px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            background-color: transparent;
            border: 1px solid transparent;
            transition: all var(--transition-fast);
        }

        .item-nota:hover {
            background-color: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
        }

        .item-nota.ativa {
            background-color: rgba(99, 102, 241, 0.12);
            color: var(--text-main);
            border-color: rgba(99, 102, 241, 0.3);
            font-weight: 600;
        }

        .item-nota-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 75%;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-actions-group {
            display: flex;
            gap: 4px;
            opacity: 0.6;
            transition: opacity var(--transition-fast);
        }

        .item-nota:hover .btn-actions-group,
        .item-nota.ativa .btn-actions-group {
            opacity: 1;
        }

        .btn-action {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 4px 6px;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
        }

        .btn-action:hover {
            background-color: var(--bg-card);
            color: var(--text-main);
        }

        .btn-delete:hover {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }

        .btn-restore:hover {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }

        /* --- ÁREA PRINCIPAL --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            padding-top: 80px;
            background-color: var(--bg-main);
            height: 100%;
            overflow-y: auto;
            position: relative;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        .editor-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .fonte-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: var(--bg-sidebar);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .fonte-control input[type="range"] {
            accent-color: var(--accent-primary);
            cursor: pointer;
            width: 90px;
        }

        .input-titulo {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 20px;
            outline: none;
            width: 100%;
            letter-spacing: -0.5px;
        }

        .input-titulo::placeholder {
            color: var(--text-dim);
        }

        .textarea-conteudo {
            background: transparent;
            border: none;
            color: #e5e7eb;
            font-family: 'Georgia', Cambria, serif;
            font-size: 18px;
            line-height: 1.7;
            outline: none;
            resize: none;
            flex: 1;
            width: 100%;
        }

        .textarea-conteudo::placeholder {
            color: var(--text-dim);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .aviso-vazio {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 16px;
            text-align: center;
            gap: 12px;
        }

        .aviso-vazio-icon {
            font-size: 48px;
            opacity: 0.6;
        }

        /* Scrollbar Personalizada */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        /* RESPONSIVIDADE PARA DISPOSITIVOS MÓVEIS / TABLETS */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                box-shadow: var(--shadow-md);
            }
            .main-content {
                padding: 20px;
                padding-top: 80px;
            }
            .input-titulo {
                font-size: 24px;
            }
            .textarea-conteudo {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <button class="btn-toggle-sidebar" id="toggle-btn" onclick="toggleSidebar()">
        <span>☰</span>
        <span>Menu</span>
    </button>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>📚 Notas do Livro</h2>
        </div>

        <button class="btn-nova-nota" onclick="criarNovaNota()">
            <span>➕</span> Nova Nota
        </button>

        <div class="backup-container">
            <button class="btn-backup" onclick="exportarBackup()" title="Guardar cópia de segurança">
                💾 Exportar
            </button>
            <label class="btn-backup file-input-label" title="Carregar cópia de segurança">
                📂 Importar
                <input type="file" id="input-backup" accept=".json" onchange="importarBackup(event)">
            </label>
        </div>

        <div class="section-header">
            <span class="section-title">Minhas Notas</span>
            <span class="section-count" id="count-ativas">0</span>
        </div>
        <div class="lista-notas" id="lista-ativas"></div>

        <div class="section-header">
            <span class="section-title">Lixeira</span>
            <span class="section-count" id="count-lixeira">0</span>
        </div>
        <div class="lista-notas" id="lista-lixeira"></div>
    </div>

    <div class="main-content">
        <div class="editor-container" id="editor" style="display: none;">
            <div class="editor-bar">
                <div style="font-size: 12px; color: var(--text-dim);">A editar nota</div>
                <div class="fonte-control">
                    <span>A-</span>
                    <input type="range" id="alterar-fonte" min="14" max="32" value="18" oninput="mudarTamanhoFonte(this.value)">
                    <span>A+</span>
                    <span id="valor-fonte" style="font-weight: 600; color: var(--text-main);">18px</span>
                </div>
            </div>

            <input type="text" id="nota-titulo" class="input-titulo" placeholder="Título da nota..." oninput="salvarNotaAtual()">
            <textarea id="nota-conteudo" class="textarea-conteudo" placeholder="Comece a escrever as informações do seu livro aqui..." oninput="salvarNotaAtual()"></textarea>
        </div>
        
        <div class="aviso-vazio" id="aviso-vazio">
            <div class="aviso-vazio-icon">📝</div>
            <p>Selecione uma nota da lista ou crie uma nova para começar a escrever.</p>
        </div>
    </div>

    <script>
        let notas = JSON.parse(localStorage.getItem('livro_notas')) || [];
        let idNotaAtiva = null;
        let tamanhoFonteSalvo = localStorage.getItem('preferencia_fonte') || '18';

        renderizarListas();
        mudarTamanhoFonte(tamanhoFonteSalvo);

        function criarNovaNota() {
            const novaNota = {
                id: Date.now().toString(),
                titulo: 'Nova Nota',
                conteudo: '',
                naLixeira: false
            };
            notas.unshift(novaNota);
            salvarNoLocalStorage();
            carregarNota(novaNota.id);
        }

        function renderizarListas() {
            const listaAtivas = document.getElementById('lista-ativas');
            const listaLixeira = document.getElementById('lista-lixeira');
            const countAtivas = document.getElementById('count-ativas');
            const countLixeira = document.getElementById('count-lixeira');
            
            listaAtivas.innerHTML = '';
            listaLixeira.innerHTML = '';

            let qtdAtivas = 0;
            let qtdLixeira = 0;

            notas.forEach(nota => {
                const item = document.createElement('div');
                item.className = `item-nota ${nota.id === idNotaAtiva ? 'ativa' : ''}`;
                
                if (!nota.naLixeira) {
                    qtdAtivas++;
                    item.onclick = () => carregarNota(nota.id);
                    item.innerHTML = `
                        <div class="item-nota-title">
                            <span>📄</span>
                            <span>${escapeHtml(nota.titulo) || 'Sem título'}</span>
                        </div>
                        <div class="btn-actions-group">
                            <button class="btn-action btn-delete" title="Mover para a lixeira" onclick="moverParaLixeira(event, '${nota.id}')">🗑️</button>
                        </div>
                    `;
                    listaAtivas.appendChild(item);
                } else {
                    qtdLixeira++;
                    item.innerHTML = `
                        <div class="item-nota-title" style="color: var(--text-dim); text-decoration: line-through;">
                            <span>📄</span>
                            <span>${escapeHtml(nota.titulo) || 'Sem título'}</span>
                        </div>
                        <div class="btn-actions-group">
                            <button class="btn-action btn-restore" title="Restaurar" onclick="restaurarDaLixeira(event, '${nota.id}')">↩️</button>
                            <button class="btn-action btn-delete" title="Excluir Permanentemente" onclick="excluirPermanente(event, '${nota.id}')">❌</button>
                        </div>
                    `;
                    listaLixeira.appendChild(item);
                }
            });

            countAtivas.innerText = qtdAtivas;
            countLixeira.innerText = qtdLixeira;
        }

        function escapeHtml(texto) {
            if (!texto) return '';
            return texto
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function carregarNota(id) {
            const nota = notas.find(n => n.id === id);
            if (!nota || nota.naLixeira) {
                fecharEditor();
                return;
            }

            idNotaAtiva = id;
            document.getElementById('aviso-vazio').style.display = 'none';
            document.getElementById('editor').style.display = 'flex';

            document.getElementById('nota-titulo').value = nota.titulo;
            document.getElementById('nota-conteudo').value = nota.conteudo;

            renderizarListas();
        }

        function salvarNotaAtual() {
            if (!idNotaAtiva) return;

            const nota = notas.find(n => n.id === idNotaAtiva);
            if (nota) {
                nota.titulo = document.getElementById('nota-titulo').value;
                nota.conteudo = document.getElementById('nota-conteudo').value;
                salvarNoLocalStorage();
                renderizarListas();
            }
        }

        function moverParaLixeira(event, id) {
            event.stopPropagation();
            const nota = notas.find(n => n.id === id);
            if (nota) {
                nota.naLixeira = true;
                if (idNotaAtiva === id) fecharEditor();
                salvarNoLocalStorage();
                renderizarListas();
            }
        }

        function restaurarDaLixeira(event, id) {
            event.stopPropagation();
            const nota = notas.find(n => n.id === id);
            if (nota) {
                nota.naLixeira = false;
                salvarNoLocalStorage();
                carregarNota(id);
            }
        }

        function excluirPermanente(event, id) {
            event.stopPropagation();
            if (confirm("Deseja excluir permanentemente esta nota? Esta ação não pode ser desfeita.")) {
                notas = notas.filter(n => n.id !== id);
                salvarNoLocalStorage();
                renderizarListas();
            }
        }

        function fecharEditor() {
            idNotaAtiva = null;
            document.getElementById('editor').style.display = 'none';
            document.getElementById('aviso-vazio').style.display = 'flex';
            renderizarListas();
        }

        function salvarNoLocalStorage() {
            localStorage.setItem('livro_notas', JSON.stringify(notas));
        }

        function mudarTamanhoFonte(valor) {
            const caixaTexto = document.getElementById('nota-conteudo');
            if (caixaTexto) {
                caixaTexto.style.fontSize = valor + 'px';
            }
            document.getElementById('valor-fonte').innerText = valor + 'px';
            document.getElementById('alterar-fonte').value = valor;
            localStorage.setItem('preferencia_fonte', valor);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('escondida');
        }

        function exportarBackup() {
            if (notas.length === 0) {
                alert("Você não possui notas para exportar.");
                return;
            }
            
            const dadosStr = JSON.stringify(notas, null, 2);
            const blob = new Blob([dadosStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const dataAtual = new Date().toISOString().slice(0, 10);
            const link = document.createElement('a');
            link.href = url;
            link.download = `backup_livro_${dataAtual}.json`;
            link.click();
            
            URL.revokeObjectURL(url);
        }

        function importarBackup(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            const leitor = new FileReader();
            leitor.onload = function(e) {
                try {
                    const notasImportadas = JSON.parse(e.target.result);
                    
                    if (Array.isArray(notasImportadas)) {
                        if (confirm("Deseja mesclar as notas importadas com as atuais? (Clique em Cancelar para substituir tudo).")) {
                            const idsExistentes = new Set(notas.map(n => n.id));
                            const novasFiltradas = notasImportadas.filter(n => !idsExistentes.has(n.id));
                            notas = [...novasFiltradas, ...notas];
                        } else {
                            notas = notasImportadas;
                        }
                        
                        salvarNoLocalStorage();
                        fecharEditor();
                        renderizarListas();
                        alert("Backup importado com sucesso!");
                    } else {
                        alert("Formato de arquivo inválido.");
                    }
                } catch (erro) {
                    alert("Erro ao ler o arquivo de backup.");
                }
                event.target.value = '';
            };
            leitor.readAsText(arquivo);
        }
    </script>
</body>
</html>
