<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Notes Pro - 100% Offline</title>
    <style>
        :root {
            --word-blue: #2b579a;
            --word-blue-dark: #1b365d;
            --word-bg: #e6e6e6;
            --word-ribbon-bg: #f3f2f1;
            --word-border: #d1d1d1;
            --sidebar-bg: #1e1e1e;
            --sidebar-text: #cccccc;
            --sidebar-hover: rgba(255, 255, 255, 0.08);
            --sidebar-active: #2b579a;
            --accent-yellow: #f1c40f;
            --accent-red: #e74c3c;
            --accent-green: #2ecc71;
            --status-bg: #2b579a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: var(--word-bg);
            color: #333;
        }

        /* --- SIDEBAR LATERAL --- */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            transition: margin-left 0.3s ease;
            z-index: 100;
            flex-shrink: 0;
        }

        .sidebar.escondida {
            margin-left: -320px;
        }

        .sidebar-header {
            padding: 15px;
            background: #141414;
            border-bottom: 1px solid #2a2a2a;
        }

        .sidebar-header h2 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-criar-pasta {
            width: 100%;
            padding: 10px;
            background: var(--word-blue);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-criar-pasta:hover {
            background: #1d3d6e;
        }

        .busca-container {
            padding: 10px 15px;
            background: #181818;
            border-bottom: 1px solid #2a2a2a;
        }

        .input-busca {
            width: 100%;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #3a3a3a;
            background: #252526;
            color: white;
            font-size: 12px;
            outline: none;
        }

        .input-busca:focus {
            border-color: var(--word-blue);
        }

        .backup-section {
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            background: #181818;
            border-bottom: 1px solid #2a2a2a;
        }

        .btn-backup {
            flex: 1;
            padding: 6px;
            background: #2d2d2d;
            color: #ccc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
        }

        .btn-backup:hover {
            background: #3e3e3e;
            color: white;
        }

        .section-title {
            font-size: 11px;
            font-weight: bold;
            color: #777;
            padding: 12px 15px 6px 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .container-pastas {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 10px 10px;
        }

        .card-pasta {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px;
            margin-bottom: 8px;
            padding: 6px;
        }

        .item-pasta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            font-weight: 600;
            font-size: 13px;
            color: #eee;
        }

        .pasta-info {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            max-width: 65%;
        }

        .badge-sub {
            background: #333;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            color: #aaa;
        }

        .lista-subnotas {
            margin-left: 10px;
            border-left: 2px solid #333;
            padding-left: 6px;
            margin-top: 4px;
        }

        .item-subnota {
            padding: 6px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #bbb;
            margin: 2px 0;
        }

        .item-subnota:hover {
            background: var(--sidebar-hover);
            color: white;
        }

        .item-subnota.ativa {
            background: var(--sidebar-active);
            color: white;
            font-weight: bold;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 2px 4px;
            font-size: 12px;
            border-radius: 3px;
        }

        .btn-icon:hover { color: white; }
        .btn-pin.fixado { color: var(--accent-yellow); }
        .btn-del:hover { color: var(--accent-red); }

        /* --- ÁREA PRINCIPAL --- */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- WORD HEADER --- */
        .word-header {
            background-color: var(--word-blue);
            color: white;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            user-select: none;
        }

        .btn-toggle-side {
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .btn-toggle-side:hover {
            background: rgba(255,255,255,0.2);
        }

        .word-title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* --- RIBBON (FAIXA DE OPÇÕES) --- */
        .ribbon-tabs {
            background-color: var(--word-ribbon-bg);
            border-bottom: 1px solid var(--word-border);
            display: flex;
            padding: 0 10px;
            user-select: none;
        }

        .ribbon-tab {
            padding: 6px 15px;
            font-size: 12px;
            cursor: pointer;
            color: #444;
            border-bottom: 2px solid transparent;
        }

        .ribbon-tab.active {
            border-bottom: 2px solid var(--word-blue);
            color: var(--word-blue);
            font-weight: bold;
            background: #fff;
        }

        .ribbon-toolbar {
            background-color: #fff;
            border-bottom: 1px solid var(--word-border);
            padding: 6px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            user-select: none;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 3px;
            padding-right: 8px;
            border-right: 1px solid #e0e0e0;
        }

        .tool-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 4px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 26px;
            height: 26px;
        }

        .tool-btn:hover {
            background-color: #e5e5e5;
            border-color: #ccc;
        }

        .tool-select {
            padding: 3px 6px;
            border: 1px solid var(--word-border);
            border-radius: 3px;
            font-size: 12px;
            outline: none;
            background: white;
            cursor: pointer;
        }

        /* --- ÁREA DO DOCUMENTO --- */
        .editor-container-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            background-color: var(--word-bg);
        }

        .word-document {
            background: white;
            width: 100%;
            max-width: 800px;
            min-height: 950px;
            padding: 60px 70px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            margin-bottom: 40px;
        }

        .input-document-title {
            border: none;
            border-bottom: 2px solid transparent;
            outline: none;
            font-size: 26px;
            font-weight: bold;
            color: #2b2b2b;
            margin-bottom: 25px;
            width: 100%;
            padding-bottom: 5px;
        }

        .input-document-title:focus {
            border-bottom-color: var(--word-blue);
        }

        .editor-body {
            flex: 1;
            outline: none;
            font-size: 15px;
            line-height: 1.7;
            color: #333;
            min-height: 700px;
        }

        .editor-body p {
            margin-bottom: 12px;
        }

        .aviso-vazio-main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #666;
            text-align: center;
        }

        .aviso-vazio-main span {
            font-size: 54px;
            margin-bottom: 15px;
        }

        /* --- BARRA DE STATUS (BOTTOM WORD BAR) --- */
        .status-bar {
            background-color: var(--status-bg);
            color: white;
            font-size: 11px;
            padding: 4px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .status-info {
            display: flex;
            gap: 15px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>📘 Word Notes Pro</h2>
            <button class="btn-criar-pasta" onclick="criarColecao()">+ Nova Coleção</button>
        </div>

        <div class="busca-container">
            <input type="text" class="input-busca" placeholder="🔍 Pesquisar notas..." oninput="filtrarSubNotas(this.value)">
        </div>

        <div class="backup-section">
            <button class="btn-backup" onclick="exportarBackup()">💾 Exportar</button>
            <label class="btn-backup" style="display:block; text-align:center;">
                📂 Importar
                <input type="file" id="input-file" accept=".json" style="display:none;" onchange="importarBackup(event)">
            </label>
        </div>

        <div class="section-title" id="title-fixados">📌 Fixados (0/3)</div>
        <div class="container-pastas" id="lista-fixados"></div>

        <div class="section-title">📁 Minhas Coleções</div>
        <div class="container-pastas" id="lista-comuns"></div>

        <div class="section-title">🗑️ Lixeira</div>
        <div class="container-pastas" id="lista-lixeira" style="max-height: 120px;"></div>
    </div>

    <div class="main-wrapper">
        <div class="word-header">
            <button class="btn-toggle-side" onclick="toggleSidebar()" title="Ocultar/Exibir Barra Lateral">☰</button>
            <div class="word-title" id="word-header-title">Word Notes Pro - Documento</div>
        </div>

        <div class="ribbon-tabs">
            <div class="ribbon-tab active">Página Inicial</div>
            <div class="ribbon-tab" onclick="imprimirDocumento()">Imprimir / PDF</div>
            <div class="ribbon-tab" onclick="exportarComoTxt()">Baixar TXT</div>
        </div>

        <div class="ribbon-toolbar">
            <div class="tool-group">
                <button class="tool-btn" onclick="execCmd('undo')" title="Desfazer (Ctrl+Z)">↩️</button>
                <button class="tool-btn" onclick="execCmd('redo')" title="Refazer (Ctrl+Y)">↪️</button>
            </div>

            <div class="tool-group">
                <select class="tool-select" onchange="execCmd('fontName', this.value)">
                    <option value="Segoe UI">Segoe UI</option>
                    <option value="Arial">Arial</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Verdana">Verdana</option>
                </select>
                <select class="tool-select" onchange="execCmd('fontSize', this.value)">
                    <option value="2">10pt</option>
                    <option value="3" selected>12pt</option>
                    <option value="4">14pt</option>
                    <option value="5">18pt</option>
                    <option value="6">24pt</option>
                    <option value="7">36pt</option>
                </select>
            </div>

            <div class="tool-group">
                <button class="tool-btn" onclick="execCmd('bold')" title="Negrito (Ctrl+B)"><b>B</b></button>
                <button class="tool-btn" onclick="execCmd('italic')" title="Itálico (Ctrl+I)"><i>I</i></button>
                <button class="tool-btn" onclick="execCmd('underline')" title="Sublinhado (Ctrl+U)"><u>U</u></button>
                <button class="tool-btn" onclick="execCmd('strikeThrough')" title="Tachado"><s>S</s></button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" onclick="execCmd('justifyLeft')" title="Alinhar à Esquerda">⇐</button>
                <button class="tool-btn" onclick="execCmd('justifyCenter')" title="Centralizar">⇔</button>
                <button class="tool-btn" onclick="execCmd('justifyRight')" title="Alinhar à Direita">⇒</button>
                <button class="tool-btn" onclick="execCmd('justifyFull')" title="Justificar">≡</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" onclick="execCmd('insertUnorderedList')" title="Lista com Marcadores">• Lista</button>
                <button class="tool-btn" onclick="execCmd('insertOrderedList')" title="Lista Numerada">1. Lista</button>
            </div>

            <div class="tool-group">
                <input type="color" title="Cor do Texto" onchange="execCmd('foreColor', this.value)" style="border:none; width:24px; height:24px; cursor:pointer; background:transparent;">
                <button class="tool-btn" onclick="execCmd('backColor', '#f1c40f')" title="Marca-Texto Amarelo">🖍️</button>
                <button class="tool-btn" onclick="execCmd('removeFormat')" title="Limpar Formatação">🧹</button>
            </div>
        </div>

        <div class="editor-container-wrapper">
            <div class="word-document" id="paper-editor" style="display: none;">
                <input type="text" id="doc-title" class="input-document-title" placeholder="Título do Documento..." oninput="salvarNotaAtual()">
                <div id="doc-body" class="editor-body" contenteditable="true" oninput="salvarNotaAtual()"></div>
            </div>

            <div class="aviso-vazio-main" id="aviso-vazio">
                <span>📄</span>
                <h2>Nenhuma nota selecionada</h2>
                <p>Crie uma coleção no menu lateral, adicione sub-notas e comece a escrever!</p>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-info">
                <span id="stat-words">0 palavras</span>
                <span id="stat-chars">0 caracteres</span>
                <span id="stat-readtime">0 min de leitura</span>
            </div>
            <div>
                <span id="stat-save-status">Pronto (Offline)</span>
            </div>
        </div>
    </div>

    <script>
        // BANCO DE DADOS LOCAL (LOCALSTORAGE)
        let colecoes = JSON.parse(localStorage.getItem('word_notes_colecoes')) || [];
        let idColecaoAtiva = null;
        let idSubNotaAtiva = null;

        renderizar();

        function execCmd(command, value = null) {
            document.execCommand(command, false, value);
            atualizarEstatisticas();
            salvarNotaAtual();
        }

        function criarColecao() {
            const nome = prompt("Digite o nome da nova coleção/pasta:", "Minha Coleção");
            if (!nome || !nome.trim()) return;

            const nova = {
                id: Date.now().toString(),
                titulo: nome.trim(),
                fixada: false,
                subnotas: []
            };

            colecoes.unshift(nova);
            salvar();
            renderizar();
        }

        function criarSubNota(e, idColecao) {
            e.stopPropagation();
            const col = colecoes.find(c => c.id === idColecao);
            if (!col) return;

            const sub = {
                id: Date.now().toString(),
                titulo: "Nova Sub-nota",
                conteudo: "<p>Comece a escrever seu texto aqui...</p>",
                naLixeira: false
            };

            col.subnotas.unshift(sub);
            salvar();
            carregarSubNota(idColecao, sub.id);
        }

        function toggleFixar(e, idColecao) {
            e.stopPropagation();
            const col = colecoes.find(c => c.id === idColecao);
            if (!col) return;

            if (!col.fixada) {
                const fixadas = colecoes.filter(c => c.fixada).length;
                if (fixadas >= 3) {
                    alert("Limite atingido! Você só pode fixar no máximo 3 coleções no topo.");
                    return;
                }
                col.fixada = true;
            } else {
                col.fixada = false;
            }

            salvar();
            renderizar();
        }

        function renderizar(termoBusca = "") {
            const listFixados = document.getElementById('lista-fixados');
            const listComuns = document.getElementById('lista-comuns');
            const listLixeira = document.getElementById('lista-lixeira');

            listFixados.innerHTML = '';
            listComuns.innerHTML = '';
            listLixeira.innerHTML = '';

            let qtdFixados = 0;

            colecoes.forEach(col => {
                if (col.fixada) qtdFixados++;

                const subNotasValidas = col.subnotas.filter(s => !s.naLixeira && s.titulo.toLowerCase().includes(termoBusca.toLowerCase()));

                const card = document.createElement('div');
                card.className = 'card-pasta';

                card.innerHTML = `
                    <div class="item-pasta-header">
                        <div class="pasta-info">
                            <span>📁</span>
                            <span title="${col.titulo}">${col.titulo}</span>
                            <span class="badge-sub">${subNotasValidas.length}</span>
                        </div>
                        <div>
                            <button class="btn-icon btn-pin ${col.fixada ? 'fixado' : ''}" onclick="toggleFixar(event, '${col.id}')" title="${col.fixada ? 'Desafixar' : 'Fixar no topo (Máx 3)'}">📌</button>
                            <button class="btn-icon" onclick="criarSubNota(event, '${col.id}')" title="Criar Sub-nota">➕</button>
                            <button class="btn-icon btn-del" onclick="excluirColecao(event, '${col.id}')" title="Excluir Coleção">🗑️</button>
                        </div>
                    </div>
                `;

                if (subNotasValidas.length > 0) {
                    const subList = document.createElement('div');
                    subList.className = 'lista-subnotas';

                    subNotasValidas.forEach(sub => {
                        const itemSub = document.createElement('div');
                        itemSub.className = `item-subnota ${sub.id === idSubNotaAtiva ? 'ativa' : ''}`;
                        itemSub.onclick = () => carregarSubNota(col.id, sub.id);
                        itemSub.innerHTML = `
                            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:80%;">📄 ${sub.titulo}</span>
                            <button class="btn-icon btn-del" onclick="moverParaLixeira(event, '${col.id}', '${sub.id}')" title="Mover para Lixeira">🗑️</button>
                        `;
                        subList.appendChild(itemSub);
                    });

                    card.appendChild(subList);
                }

                if (col.fixada) {
                    listFixados.appendChild(card);
                } else {
                    listComuns.appendChild(card);
                }

                // Sub-notas na Lixeira
                col.subnotas.filter(s => s.naLixeira).forEach(sub => {
                    const lixItem = document.createElement('div');
                    lixItem.className = 'item-subnota';
                    lixItem.innerHTML = `
                        <span style="text-decoration:line-through; font-size:11px; overflow:hidden; text-overflow:ellipsis; max-width:70%;">${sub.titulo}</span>
                        <div>
                            <button class="btn-icon" onclick="restaurarSub('${col.id}', '${sub.id}')" title="Restaurar">↩️</button>
                            <button class="btn-icon btn-del" onclick="excluirPermanente('${col.id}', '${sub.id}')" title="Apagar para sempre">❌</button>
                        </div>
                    `;
                    listLixeira.appendChild(lixItem);
                });
            });

            document.getElementById('title-fixados').innerText = `📌 Fixados (${qtdFixados}/3)`;
        }

        function carregarSubNota(idColecao, idSub) {
            const col = colecoes.find(c => c.id === idColecao);
            if (!col) return;

            const sub = col.subnotas.find(s => s.id === idSub);
            if (!sub || sub.naLixeira) return;

            idColecaoAtiva = idColecao;
            idSubNotaAtiva = idSub;

            document.getElementById('aviso-vazio').style.display = 'none';
            document.getElementById('paper-editor').style.display = 'flex';

            document.getElementById('doc-title').value = sub.titulo;
            document.getElementById('doc-body').innerHTML = sub.conteudo;
            document.getElementById('word-header-title').innerText = `${col.titulo} - ${sub.titulo}`;

            atualizarEstatisticas();
            renderizar();
        }

        function salvarNotaAtual() {
            if (!idColecaoAtiva || !idSubNotaAtiva) return;

            const col = colecoes.find(c => c.id === idColecaoAtiva);
            if (col) {
                const sub = col.subnotas.find(s => s.id === idSubNotaAtiva);
                if (sub) {
                    sub.titulo = document.getElementById('doc-title').value || "Sem título";
                    sub.conteudo = document.getElementById('doc-body').innerHTML;
                    salvar();
                    
                    document.getElementById('word-header-title').innerText = `${col.titulo} - ${sub.titulo}`;
                    
                    const elementoAtivo = document.querySelector('.item-subnota.ativa span');
                    if(elementoAtivo) elementoAtivo.innerText = '📄 ' + sub.titulo;

                    atualizarEstatisticas();
                }
            }
        }

        function moverParaLixeira(e, idColecao, idSub) {
            e.stopPropagation();
            const col = colecoes.find(c => c.id === idColecao);
            if (col) {
                const sub = col.subnotas.find(s => s.id === idSub);
                if (sub) {
                    sub.naLixeira = true;
                    if (idSubNotaAtiva === idSub) fecharEditor();
                    salvar();
                    renderizar();
                }
            }
        }

        function restaurarSub(idColecao, idSub) {
            const col = colecoes.find(c => c.id === idColecao);
            if (col) {
                const sub = col.subnotas.find(s => s.id === idSub);
                if (sub) {
                    sub.naLixeira = false;
                    salvar();
                    carregarSubNota(idColecao, idSub);
                }
            }
        }

        function excluirPermanente(idColecao, idSub) {
            if (confirm("Deseja apagar esta nota permanentemente?")) {
                const col = colecoes.find(c => c.id === idColecao);
                if (col) {
                    col.subnotas = col.subnotas.filter(s => s.id !== idSub);
                    salvar();
                    renderizar();
                }
            }
        }

        function excluirColecao(e, idColecao) {
            e.stopPropagation();
            if (confirm("Deseja apagar esta coleção inteira e todas as suas sub-notas?")) {
                colecoes = colecoes.filter(c => c.id !== idColecao);
                if (idColecaoAtiva === idColecao) fecharEditor();
                salvar();
                renderizar();
            }
        }

        function fecharEditor() {
            idSubNotaAtiva = null;
            idColecaoAtiva = null;
            document.getElementById('paper-editor').style.display = 'none';
            document.getElementById('aviso-vazio').style.display = 'flex';
            document.getElementById('word-header-title').innerText = "Word Notes Pro - Documento";
            atualizarEstatisticas(true);
            renderizar();
        }

        function atualizarEstatisticas(zerar = false) {
            if (zerar) {
                document.getElementById('stat-words').innerText = "0 palavras";
                document.getElementById('stat-chars').innerText = "0 caracteres";
                document.getElementById('stat-readtime').innerText = "0 min de leitura";
                return;
            }

            const texto = document.getElementById('doc-body').innerText || "";
            const caracteres = texto.length;
            const palavras = texto.trim() ? texto.trim().split(/\s+/).length : 0;
            const tempoLeitura = Math.ceil(palavras / 200);

            document.getElementById('stat-words').innerText = `${palavras} palavra${palavras === 1 ? '' : 's'}`;
            document.getElementById('stat-chars').innerText = `${caracteres} caractere${caracteres === 1 ? '' : 's'}`;
            document.getElementById('stat-readtime').innerText = `~${tempoLeitura} min de leitura`;
            document.getElementById('stat-save-status').innerText = "Salvo automaticamente";
        }

        function filtrarSubNotas(termo) {
            renderizar(termo);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('escondida');
        }

        function salvar() {
            localStorage.setItem('word_notes_colecoes', JSON.stringify(colecoes));
        }

        function exportarComoTxt() {
            if (!idSubNotaAtiva) return alert("Abra uma nota para exportar em formato TXT.");
            const titulo = document.getElementById('doc-title').value || "Nota";
            const texto = document.getElementById('doc-body').innerText || "";
            
            const blob = new Blob([`${titulo}\n\n${texto}`], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${titulo.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.txt`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function imprimirDocumento() {
            if (!idSubNotaAtiva) return alert("Abra uma nota para imprimir.");
            window.print();
        }

        function exportarBackup() {
            if (colecoes.length === 0) return alert("Nenhum dado para exportar.");
            const blob = new Blob([JSON.stringify(colecoes, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_word_notes_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importarBackup(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const dados = JSON.parse(evt.target.result);
                    if (Array.isArray(dados)) {
                        if (confirm("Deseja mesclar o backup importado com as coleções existentes? (Clique em Cancelar para substituir tudo).")) {
                            const idsExistentes = new Set(colecoes.map(c => c.id));
                            const novasFiltradas = dados.filter(c => !idsExistentes.has(c.id));
                            colecoes = [...novasFiltradas, ...colecoes];
                        } else {
                            colecoes = dados;
                        }
                        salvar();
                        fecharEditor();
                        renderizar();
                        alert("Backup importado com sucesso!");
                    }
                } catch(err) {
                    alert("Arquivo de backup inválido.");
                }
                e.target.value = '';
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
